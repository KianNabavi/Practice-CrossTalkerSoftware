    <!-- Put this RIGHT at the top of <body>, before everything else -->
<div id="loader">
  <div class="spinner"></div>
</div>

<style>
  #loader {
    position: fixed;
    inset: 0;               /* covers the whole screen */
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }

  #loader.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #eee;
    border-top-color: #333;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>

<script>
  // Hide loader once everything (images, fonts, etc.) is loaded
  window.addEventListener('load', () => {
    document.getElementById('loader').classList.add('hidden');
  });
</script>
